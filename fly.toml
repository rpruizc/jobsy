# fly.toml app configuration file generated for jobsy on 2026-06-07T19:24:16-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jobsy'
primary_region = 'sjc'

[build]

[env]
  DB_PATH = '/data/jobsy.db'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'jobsy_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
